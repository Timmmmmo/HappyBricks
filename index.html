<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>快乐消除 Happy Bricks - 救援行动</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;touch-action:none}
body{background:linear-gradient(180deg,#5D4037 0%,#4E342E 50%,#3E2723 100%);font-family:-apple-system,'Segoe UI',sans-serif;display:flex;justify-content:center;align-items:center;user-select:none;-webkit-user-select:none}

#game-container{position:relative;width:100%;max-width:420px;height:100%;max-height:800px;display:flex;flex-direction:column;background:linear-gradient(180deg,#795548 0%,#8D6E63 40%,#A1887F 100%);overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,0.6)}

/* 顶部状态栏 */
#header{flex:0 0 auto;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(62,39,35,0.95),rgba(62,39,35,0.85));backdrop-filter:blur(10px);z-index:10;box-shadow:0 2px 15px rgba(0,0,0,0.3)}
#header .info{display:flex;gap:12px}
#header .stat{text-align:center;min-width:45px;padding:4px 8px;background:rgba(255,255,255,0.1);border-radius:12px}
#header .stat-value{font-size:1.2em;font-weight:800;color:#FFCC80;text-shadow:0 1px 2px rgba(0,0,0,0.3)}
#header .stat-label{font-size:0.55em;color:#D7CCC8;text-transform:uppercase;letter-spacing:0.5px}
#level-display{font-size:1em;font-weight:800;color:#FFF8E1;background:linear-gradient(135deg,#FF6F00,#E65100);padding:5px 12px;border-radius:15px;box-shadow:0 2px 8px rgba(230,81,0,0.4)}

/* 压力条 */
#pressure-bar{flex:0 0 auto;height:8px;background:#3E2723;position:relative;overflow:hidden}
#pressure-fill{position:absolute;left:0;top:0;height:100%;width:0%;background:linear-gradient(90deg,#FF5722,#FF9800,#FFEB3B);transition:width 0.3s ease;box-shadow:0 0 10px rgba(255,87,34,0.5)}
#pressure-label{position:absolute;right:8px;top:-18px;font-size:0.65em;color:#FFCC80;font-weight:700}

#canvas-wrap{flex:1 1 0;position:relative;overflow:hidden}
#game-canvas{display:block;width:100%;height:100%}

#launch-hint{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);font-size:0.85em;color:#FFF8E1;background:rgba(62,39,35,0.9);padding:10px 18px;border-radius:20px;pointer-events:none;white-space:nowrap;box-shadow:0 4px 15px rgba(0,0,0,0.3);animation:pulse 2s infinite;border:2px solid #FFCC80}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1);opacity:0.95}50%{transform:translateX(-50%) scale(1.03);opacity:1}}

#overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(62,39,35,0.98),rgba(93,64,55,0.98));display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;padding:16px}
#overlay.hidden{display:none}

.title{font-size:2.2em;font-weight:900;background:linear-gradient(135deg,#FFCC80,#FF6F00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;text-shadow:none;animation:bounceIn 0.6s ease-out}
@keyframes bounceIn{0%{transform:scale(0.5);opacity:0}50%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.subtitle{color:#D7CCC8;margin-bottom:16px;font-size:0.95em;text-align:center;line-height:1.6}
.subtitle em{color:#FFCC80;font-style:normal;font-weight:700}

.card{background:rgba(255,255,255,0.08);border-radius:16px;padding:14px 18px;margin:8px 0;box-shadow:0 4px 20px rgba(0,0,0,0.2);max-width:320px;width:100%;border:1px solid rgba(255,204,128,0.2)}
.card-title{font-size:0.75em;color:#FFCC80;font-weight:800;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.card p{font-size:0.85em;color:#D7CCC8;line-height:1.7;margin:3px 0}
.card p strong{color:#FFCC80}

.btn{margin-top:16px;padding:14px 40px;border:none;border-radius:25px;background:linear-gradient(135deg,#FF6F00,#E65100);color:white;font-size:1.1em;font-weight:800;cursor:pointer;box-shadow:0 5px 18px rgba(230,81,0,0.5);transition:transform 0.15s,box-shadow 0.15s;position:relative;overflow:hidden}
.btn:active{transform:scale(0.96);box-shadow:0 3px 12px rgba(230,81,0,0.4)}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);transform:translateX(-100%);animation:shimmer 2s infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}

.result-title{font-size:1.8em;font-weight:800;margin-bottom:12px}
.result-title.win{color:#81C784}
.result-title.lose{color:#EF5350}
.result-stats{display:flex;gap:20px;margin-bottom:16px}
.result-stat{text-align:center;padding:8px 12px;background:rgba(255,255,255,0.08);border-radius:12px}
.result-stat-value{font-size:1.6em;font-weight:800;color:#FFCC80}
.result-stat-label{font-size:0.7em;color:#D7CCC8}

#pause-btn{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.15);border:1px solid rgba(255,204,128,0.3);cursor:pointer;z-index:20;font-size:1em;color:#FFCC80;display:none}
#pause-btn:active{transform:scale(0.95)}
#sound-btn{position:absolute;top:8px;left:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.15);border:1px solid rgba(255,204,128,0.3);cursor:pointer;z-index:20;font-size:0.9em;color:#FFCC80;display:none}
#sound-btn:active{transform:scale(0.95)}

/* 紧急状态动画 */
@keyframes danger-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,87,34,0.4)}50%{box-shadow:0 0 0 8px rgba(255,87,34,0)}}
.danger-mode{animation:danger-pulse 1s infinite}
</style>
</head>
<body>
<div id="game-container">
  <div id="header">
    <div class="info">
      <div class="stat"><span class="stat-value" id="score-val">0</span><span class="stat-label">分数</span></div>
      <div class="stat"><span class="stat-value" id="balls-val">10</span><span class="stat-label">弹球</span></div>
      <div class="stat"><span class="stat-value" id="time-val">60</span><span class="stat-label">时间</span></div>
    </div>
    <div id="level-display">第 1 关</div>
  </div>
  <div id="pressure-bar">
    <div id="pressure-fill"></div>
    <span id="pressure-label">⚠️ 石块压力</span>
  </div>
  <button id="pause-btn" onclick="togglePause()">⏸</button>
  <button id="sound-btn" onclick="toggleSound()">🔊</button>
  <div id="canvas-wrap">
    <canvas id="game-canvas"></canvas>
    <div id="launch-hint">👆 滑动瞄准，快速清除石块！</div>
  </div>
  <div id="overlay">
    <div class="title">🪨 救援行动</div>
    <div class="subtitle">石块从四面围困父子！<br>时间紧迫，<em>快速清除石块</em>让他们脱险！</div>
    <div class="card">
      <div class="card-title">🚨 紧急状况</div>
      <p>父子被困在石圈中央！</p>
      <p>上方石块持续施加<strong>压力</strong>！</p>
      <p>必须在<strong>压力满之前</strong>清除所有石块！</p>
    </div>
    <div class="card">
      <div class="card-title">⚡ 玩法</div>
      <p>👆 <b>滑动瞄准</b> — 360°全方位射击</p>
      <p>🎯 <b>打碎石块</b> — 数字=需要击中次数</p>
      <p>⏱️ <b>争分夺秒</b> — 压力条满则失败</p>
    </div>
    <div class="card">
      <div class="card-title">💎 特殊道具</div>
      <p>⭐ <b>金币石</b> — 额外分数</p>
      <p>💣 <b>炸弹石</b> — 爆炸清场</p>
      <p>✨ <b>分裂石</b> — 多球齐发</p>
      <p>⏰ <b>时间石</b> — 减少压力</p>
    </div>
    <button class="btn" onclick="startGame()">▶ 开始救援</button>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════
//  快乐消除 Happy Bricks - V4.0 四面围困救援模式
//  石块四面围困父子，持续压力，快速营救
// ════════════════════════════════════════════════════════════

let canvas, ctx;
let W, H;

// 游戏状态
let gameState = 'idle';
let level = 1;
let score = 0;
let ballsRemaining = 10;
let timeRemaining = 60;
let highScore = parseInt(localStorage.getItem('happyBricksHighScore5') || '0');
// 连击系统
let comboCount = 0;
let comboTimer = 0;
let comboMultiplier = 1;
const COMBO_WINDOW = 1500;
let rocks = [];
let ballPool = [];
let particlePool = [];
let activeBalls = [];
let activeParticles = [];
let particles = [];
let floatingTexts = [];
let isPaused = false;

// 压力系统
let pressure = 0; // 0-100
let maxPressure = 100;
let pressureRate = 0.08; // 每帧增加量
let pressureReductionPerRock = 8; // 每消除一个石块减少的压力

// 石块配置
const ROCK_SIZE = 32;
const ROCK_PADDING = 4;

// 球配置
const BALL_R = 9;
const BALL_SPEED = 10;

// 瞄准系统
let aimStart = null;
let aimAngle = -Math.PI / 2;
let aimCurrent = null;

// 发射器
let launcherX, launcherY;

// 角色
let charAnimTime = 0;
let fatherBlink = 0, sonBlink = 0;
let charState = 'trapped'; // trapped, rescued, danger
let rescuePhase = 0;
let rescueTimer = 0;

// 震动
let screenShake = 0;

// 音效
let audioCtx = null;
let soundEnabled = true;

// ════════════════════════════════════════════════════════════
//  音效系统
// ════════════════════════════════════════════════════════════
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { soundEnabled = false; }
}

function playSound(type) {
  if (!soundEnabled || !audioCtx) return;
  const now = audioCtx.currentTime;
  try {
    switch(type) {
      case 'launch':
        { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'sine'; osc.frequency.setValueAtTime(500, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
          gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.start(now); osc.stop(now + 0.1); }
        break;
      case 'hit':
        { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'triangle'; osc.frequency.setValueAtTime(250, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
          gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now); osc.stop(now + 0.08); }
        break;
      case 'destroy':
        { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(350, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
          gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.start(now); osc.stop(now + 0.15); }
        break;
      case 'pressure':
        { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'square'; osc.frequency.setValueAtTime(100, now);
          osc.frequency.linearRampToValueAtTime(150, now + 0.1);
          gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.start(now); osc.stop(now + 0.2); }
        break;
      case 'danger':
        { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now);
          gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now); osc.stop(now + 0.3); }
        break;
      case 'win':
        [523, 659, 784, 1047, 1319].forEach((f, i) => {
          const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'sine'; osc.frequency.setValueAtTime(f, now + i * 0.1);
          gain.gain.setValueAtTime(0, now + i * 0.1);
          gain.gain.linearRampToValueAtTime(0.12, now + i * 0.1 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.25);
          osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.25);
        });
        break;
      case 'lose':
        { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(250, now);
          osc.frequency.exponentialRampToValueAtTime(60, now + 0.5);
          gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.start(now); osc.stop(now + 0.5); }
        break;
      case 'bomb':
        { for(let i = 0; i < 4; i++) {
          const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180 - i * 35, now + i * 0.05);
          osc.frequency.exponentialRampToValueAtTime(25, now + i * 0.05 + 0.18);
          gain.gain.setValueAtTime(0.18, now + i * 0.05); gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.18);
          osc.start(now + i * 0.05); osc.stop(now + i * 0.05 + 0.18); } }
        break;
      case 'time':
        { [600, 800, 1000].forEach((f, i) => {
          const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'sine'; osc.frequency.setValueAtTime(f, now + i * 0.08);
          gain.gain.setValueAtTime(0.1, now + i * 0.08); gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.15);
          osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.15); }); }
        break;
    }
  } catch(e) {}
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('sound-btn').textContent = soundEnabled ? '🔊' : '🔇';
}

// ════════════════════════════════════════════════════════════
//  关卡设计（产品经理设计）
// ════════════════════════════════════════════════════════════
const LEVEL_DESIGNS = [
  // Level 1: 入门 - 简单包围圈
  {
    name: "初困",
    time: 60,
    pressureRate: 0.06,
    layout: [
      "#########",
      "#.......#",
      "#.@...@.#",
      "#.......#",
      "#.......#",
      "#.......#",
      "#.......#",
      "#########"
    ],
    rockHits: { min: 1, max: 2 },
    specials: 0.05
  },
  // Level 2: 进阶 - 十字封锁
  {
    name: "十字锁",
    time: 55,
    pressureRate: 0.08,
    layout: [
      "#########",
      "#.##.##.#",
      "#.#...#.#",
      "#.......#",
      "#.@...@.#",
      "#.......#",
      "#.#...#.#",
      "#.##.##.#",
      "#########"
    ],
    rockHits: { min: 1, max: 3 },
    specials: 0.08
  },
  // Level 3: 挑战 - 迷宫围困
  {
    name: "迷宫困",
    time: 50,
    pressureRate: 0.1,
    layout: [
      "###########",
      "#.#.#.#.#.#",
      "#.........#",
      "#.#.#.#.#.#",
      "#.........#",
      "#.@.....@.#",
      "#.........#",
      "#.#.#.#.#.#",
      "#.........#",
      "#.#.#.#.#.#",
      "###########"
    ],
    rockHits: { min: 2, max: 4 },
    specials: 0.1
  },
  // Level 4: 大师 - 密集包围
  {
    name: "绝境",
    time: 45,
    pressureRate: 0.12,
    layout: [
      "#############",
      "##.#.#.#.##",
      "#.........#",
      "#.#.#.#.#.#",
      "#.........#",
      "#.#.#.#.#.#",
      "#.@.....@.#",
      "#.#.#.#.#.#",
      "#.........#",
      "#.#.#.#.#.#",
      "#.........#",
      "##.#.#.#.##",
      "#############"
    ],
    rockHits: { min: 2, max: 5 },
    specials: 0.12
  },
  // Level 5+: 随机生成
  null
];

// ════════════════════════════════════════════════════════════
//  初始化
// ════════════════════════════════════════════════════════════
function init() {
  canvas = document.getElementById('game-canvas');
  ctx = canvas.getContext('2d');
  resize();
  window.addEventListener('resize', resize);

  canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
  canvas.addEventListener('pointermove', onPointerMove, { passive: false });
  canvas.addEventListener('pointerup', onPointerUp, { passive: false });
  canvas.addEventListener('pointercancel', onPointerUp, { passive: false });

  requestAnimationFrame(gameLoop);
}

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  W = wrap.clientWidth;
  H = wrap.clientHeight;
  canvas.width = W;
  canvas.height = H;
  launcherX = W / 2;
  launcherY = H - 45;
}

// ════════════════════════════════════════════════════════════
//  游戏控制
// ════════════════════════════════════════════════════════════
function startGame() {
  initAudio();
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('pause-btn').style.display = 'block';
  document.getElementById('sound-btn').style.display = 'block';
  gameState = 'aiming';
  level = 1;
  score = 0;
  loadLevel(level);
}

function loadLevel(lvl) {
  rocks = [];
  balls = [];
  particles = [];
  floatingTexts = [];
  isPaused = false;
  rescuePhase = 0;
  charState = 'trapped';

  const design = lvl <= LEVEL_DESIGNS.length ? LEVEL_DESIGNS[lvl - 1] : null;

  if (design) {
    timeRemaining = design.time;
    pressureRate = design.pressureRate;
    maxPressure = 100;
    pressure = 0;
    ballsRemaining = 10 + Math.floor(lvl / 2);

    const rows = design.layout.length;
    const cols = design.layout[0].length;
    const offsetX = (W - cols * (ROCK_SIZE + ROCK_PADDING)) / 2;
    const offsetY = 60;

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const char = design.layout[row][col];
        if (char === '#') {
          const hits = design.rockHits.min + Math.floor(Math.random() * (design.rockHits.max - design.rockHits.min + 1));
          let special = null;
          if (Math.random() < design.specials) {
            const types = ['gold', 'bomb', 'time'];
            if (lvl >= 2) types.push('multi');
            special = types[Math.floor(Math.random() * types.length)];
          }
          rocks.push({
            x: offsetX + col * (ROCK_SIZE + ROCK_PADDING),
            y: offsetY + row * (ROCK_SIZE + ROCK_PADDING),
            w: ROCK_SIZE,
            h: ROCK_SIZE,
            hits,
            maxHits: hits,
            special,
            shake: 0
          });
        }
      }
    }
  } else {
    // 随机生成高级关卡
    timeRemaining = Math.max(40, 60 - lvl * 2);
    pressureRate = Math.min(0.15, 0.06 + lvl * 0.02);
    maxPressure = 100;
    pressure = 0;
    ballsRemaining = 12;

    const cols = Math.floor((W - 20) / (ROCK_SIZE + ROCK_PADDING));
    const rows = Math.floor((H - 150) / (ROCK_SIZE + ROCK_PADDING));
    const offsetX = (W - cols * (ROCK_SIZE + ROCK_PADDING)) / 2;
    const offsetY = 70;

    // 生成环形包围
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        // 只在边缘生成石块，中间留空给角色
        const isEdge = row < 2 || row >= rows - 2 || col < 2 || col >= cols - 2;
        const isCenter = row >= rows/2 - 1 && row <= rows/2 + 1 && col >= cols/2 - 2 && col <= cols/2 + 2;

        if (isEdge && !isCenter && Math.random() > 0.15) {
          const hits = Math.min(2 + Math.floor(lvl / 2), 6);
          let special = null;
          if (Math.random() < 0.12) {
            special = ['gold', 'bomb', 'time', 'multi'][Math.floor(Math.random() * 4)];
          }
          rocks.push({
            x: offsetX + col * (ROCK_SIZE + ROCK_PADDING),
            y: offsetY + row * (ROCK_SIZE + ROCK_PADDING),
            w: ROCK_SIZE,
            h: ROCK_SIZE,
            hits,
            maxHits: hits,
            special,
            shake: 0
          });
        }
      }
    }
  }

  updateUI();
  gameState = 'aiming';
}

function updateUI() {
  document.getElementById('score-val').textContent = score;
  document.getElementById('balls-val').textContent = ballsRemaining;
  document.getElementById('time-val').textContent = Math.ceil(timeRemaining);
  document.getElementById('level-display').textContent = `第 ${level} 关`;

  const pressurePercent = Math.min(100, (pressure / maxPressure) * 100);
  document.getElementById('pressure-fill').style.width = pressurePercent + '%';

  // 危险模式视觉提示
  const container = document.getElementById('game-container');
  if (pressurePercent > 80) {
    container.classList.add('danger-mode');
    charState = 'danger';
  } else {
    container.classList.remove('danger-mode');
    if (charState === 'danger') charState = 'trapped';
  }
}

function togglePause() {
  if (gameState === 'idle' || gameState === 'win' || gameState === 'lose') return;
  isPaused = !isPaused;
  document.getElementById('pause-btn').textContent = isPaused ? '▶' : '⏸';
}

// ════════════════════════════════════════════════════════════
//  输入处理
// ════════════════════════════════════════════════════════════
function onPointerDown(e) {
  if (gameState !== 'aiming' || isPaused) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  aimStart = { x: (e.clientX - rect.left) * W / rect.width, y: (e.clientY - rect.top) * H / rect.height };
  aimCurrent = { x: aimStart.x, y: aimStart.y };
  document.getElementById('launch-hint').style.opacity = '0';
}

function onPointerMove(e) {
  if (!aimStart || gameState !== 'aiming' || isPaused) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const cx = (e.clientX - rect.left) * W / rect.width;
  const cy = (e.clientY - rect.top) * H / rect.height;
  aimCurrent = { x: cx, y: cy };
  const dx = cx - aimStart.x, dy = cy - aimStart.y;
  if (Math.hypot(dx, dy) < 8) return;
  aimAngle = Math.atan2(dy, dx);
}

function onPointerUp(e) {
  if (!aimStart || gameState !== 'aiming' || isPaused) return;
  e.preventDefault();
  aimStart = null; aimCurrent = null;
  launchBall();
}

function launchBall() {
  if (ballsRemaining <= 0) return;
  balls.push({ x: launcherX, y: launcherY, vx: Math.cos(aimAngle) * BALL_SPEED, vy: Math.sin(aimAngle) * BALL_SPEED, trail: [] });
  ballsRemaining--;
  updateUI();
  gameState = 'playing';
  playSound('launch');
}

// ════════════════════════════════════════════════════════════
//  游戏更新
// ════════════════════════════════════════════════════════════
function update(dt) {
  if (gameState === 'idle' || gameState === 'win' || gameState === 'lose' || isPaused) return;

  charAnimTime += dt;
  if (Math.random() < 0.003) fatherBlink = 8;
  if (Math.random() < 0.004) sonBlink = 6;
  if (fatherBlink > 0) fatherBlink--;
  if (sonBlink > 0) sonBlink--;

  if (screenShake > 0) screenShake *= 0.9;

  // 压力系统
  if (rescuePhase === 0) {
    pressure += pressureRate;
    if (pressure >= maxPressure) {
      gameState = 'lose';
      playSound('lose');
      showResult(false);
      return;
    }
    // 危险音效
    if (pressure > maxPressure * 0.85 && Math.random() < 0.02) {
      playSound('danger');
    }
  }

  // 营救动画
  if (rescuePhase > 0) {
    rescueTimer += dt;
    if (rescuePhase === 1) {
      if (rescueTimer > 60) {
        rescuePhase = 2;
        charState = 'rescued';
      }
    } else if (rescuePhase === 2) {
      if (rescueTimer > 120) {
        gameState = 'win';
        playSound('win');
        if (score > highScore) { highScore = score; localStorage.setItem('happyBricksHighScore4', highScore); }
        showResult(true);
      }
    }
    return;
  }

  // 更新球
  for (let i = balls.length - 1; i >= 0; i--) {
    const ball = balls[i];
    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 8) ball.trail.shift();
    ball.x += ball.vx;
    ball.y += ball.vy;

    // 墙壁反弹
    if (ball.x < BALL_R) { ball.x = BALL_R; ball.vx = -ball.vx; }
    if (ball.x > W - BALL_R) { ball.x = W - BALL_R; ball.vx = -ball.vx; }
    if (ball.y < BALL_R) { ball.y = BALL_R; ball.vy = -ball.vy; }
    if (ball.y > H + BALL_R) { balls.splice(i, 1); continue; }

    // 石块碰撞
    for (let j = rocks.length - 1; j >= 0; j--) {
      const rock = rocks[j];
      if (checkCollision(ball, rock)) {
        rock.hits--;
        rock.shake = 5;
        playSound('hit');
        spawnHitParticles(ball.x, ball.y, getRockColor(rock));

        if (rock.hits <= 0) {
          // 消除石块减少压力
          pressure = Math.max(0, pressure - pressureReductionPerRock);

          let points = 10;
          if (rock.special === 'gold') points = 50;
          else if (rock.special === 'bomb') points = 20;
          else if (rock.special === 'time') points = 15;
          else if (rock.special === 'multi') points = 25;
          score += points;

          spawnDestroyParticles(rock.x + rock.w/2, rock.y + rock.h/2, getRockColor(rock));
          addFloatingText(rock.x + rock.w/2, rock.y, '+' + points);

          if (rock.special === 'bomb') { playSound('bomb'); explodeNearby(rock.x + rock.w/2, rock.y + rock.h/2); }
          else if (rock.special === 'time') { playSound('time'); pressure = Math.max(0, pressure - 20); addFloatingText(rock.x + rock.w/2, rock.y - 20, '⏰ -20%'); }
          else if (rock.special === 'multi') { playSound('launch'); splitBall(ball); }
          else { playSound('destroy'); }

          rocks.splice(j, 1);
          updateUI();
        }
      }
    }
  }

  rocks.forEach(r => { if (r.shake > 0) r.shake *= 0.85; });
  particles = particles.filter(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= 0.02; return p.life > 0; });
  floatingTexts = floatingTexts.filter(t => { t.y -= 1; t.life -= 0.015; return t.life > 0; });

  // 检查胜利
  if (rocks.length === 0 && rescuePhase === 0) {
    rescuePhase = 1;
    rescueTimer = 0;
    gameState = 'rescue';
  }

  // 检查回合结束
  if (balls.length === 0 && rescuePhase === 0) {
    if (ballsRemaining <= 0 && rocks.length > 0) {
      // 没球了但还有石块，给一点压力惩罚
      pressure += 10;
      ballsRemaining = 3; // 救济球
      addFloatingText(W/2, H/2, '救济 +3球');
      updateUI();
    }
    if (ballsRemaining > 0) {
      gameState = 'aiming';
      document.getElementById('launch-hint').style.opacity = '1';
    }
  }

  updateUI();
}

function checkCollision(ball, rock) {
  // 精确向量反射: 找到最近点
  const cx = Math.max(rock.x, Math.min(ball.x, rock.x + rock.w));
  const cy = Math.max(rock.y, Math.min(ball.y, rock.y + rock.h));
  const dx = ball.x - cx;
  const dy = ball.y - cy;
  const distSq = dx * dx + dy * dy;
  const radSq = BALL_R * BALL_R;
  
  if (distSq < radSq) {
    // 计算碰撞法向量（角落情况特殊处理）
    const dist = Math.sqrt(distSq) || 0.001;
    let nx = dx / dist;
    let ny = dy / dist;
    
    // 如果在砖块内部，检测从哪边进入
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) {
      // 角落碰撞 - 使用更精确的判断
      const overlapX = Math.min(ball.x - rock.x, rock.x + rock.w - ball.x);
      const overlapY = Math.min(ball.y - rock.y, rock.y + rock.h - ball.y);
      if (overlapX < overlapY) {
        nx = ball.x < rock.x + rock.w / 2 ? -1 : 1;
        ny = 0;
      } else {
        nx = 0;
        ny = ball.y < rock.y + rock.h / 2 ? -1 : 1;
      }
    }
    
    // 向量反射: v' = v - 2(v·n)n
    const dot = ball.vx * nx + ball.vy * ny;
    ball.vx = ball.vx - 2 * dot * nx;
    ball.vy = ball.vy - 2 * dot * ny;
    
    // 推出重叠区域防止粘连
    const overlap = BALL_R - dist;
    ball.x += nx * (overlap + 0.5);
    ball.y += ny * (overlap + 0.5);
    
    return true;
  }
  return false;
}

function getRockColor(rock) {
  if (rock.special) {
    return { gold: '#FFD700', bomb: '#FF5722', time: '#2196F3', multi: '#9C27B0' }[rock.special];
  }
  const colors = ['#8D6E63', '#795548', '#6D4C41', '#5D4037', '#4E342E', '#A1887F'];
  return colors[Math.min(rock.maxHits - rock.hits, colors.length - 1)];
}

function splitBall(orig) {
  for (let i = 0; i < 2; i++) {
    const angle = Math.atan2(orig.vy, orig.vx) + (Math.random() - 0.5) * 0.5;
    balls.push({ x: orig.x, y: orig.y, vx: Math.cos(angle) * BALL_SPEED, vy: Math.sin(angle) * BALL_SPEED, trail: [] });
  }
}

function explodeNearby(x, y) {
  const RADIUS = 70;
  let destroyed = 0;
  rocks.forEach(r => {
    const dist = Math.hypot(r.x + r.w/2 - x, r.y + r.h/2 - y);
    if (dist < RADIUS) {
      r.hits -= 2;
      spawnDestroyParticles(r.x + r.w/2, r.y + r.h/2, '#FF5722');
      if (r.hits <= 0) destroyed++;
    }
  });
  rocks = rocks.filter(r => r.hits > 0);
  if (destroyed > 0) {
    pressure = Math.max(0, pressure - destroyed * pressureReductionPerRock);
    addFloatingText(x, y, `💣 x${destroyed}`);
  }
}

function spawnHitParticles(x, y, color) {
  for (let i = 0; i < 5; i++) {
    particles.push({ x, y, vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4 - 1, life: 1, color, size: 4 + Math.random() * 3 });
  }
}

function spawnDestroyParticles(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 * i) / 12;
    particles.push({ x, y, vx: Math.cos(angle) * 3, vy: Math.sin(angle) * 3 - 1, life: 1, color, size: 5 + Math.random() * 4 });
  }
}

function addFloatingText(x, y, text) {
  floatingTexts.push({ x, y, text, life: 1 });
}

// ════════════════════════════════════════════════════════════
//  结果显示
// ════════════════════════════════════════════════════════════
function showResult(win) {
  document.getElementById('pause-btn').style.display = 'none';
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div class="result-title ${win ? 'win' : 'lose'}">${win ? '🎉 营救成功！' : '💔 营救失败'}</div>
    <div class="result-stats">
      <div class="result-stat"><div class="result-stat-value">${score}</div><div class="result-stat-label">分数</div></div>
      <div class="result-stat"><div class="result-stat-value">${level}</div><div class="result-stat-label">关卡</div></div>
      <div class="result-stat"><div class="result-stat-value">${Math.ceil(timeRemaining)}</div><div class="result-stat-label">剩余时间</div></div>
    </div>
    <button class="btn" onclick="${win ? 'nextLevel()' : 'retryLevel()'}">${win ? '▶ 下一关' : '🔄 重试'}</button>
  `;
}

function nextLevel() {
  level++;
  loadLevel(level);
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('pause-btn').style.display = 'block';
}

function retryLevel() {
  loadLevel(level);
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('pause-btn').style.display = 'block';
}

// ════════════════════════════════════════════════════════════
//  绘制
// ════════════════════════════════════════════════════════════
function draw() {
  const shakeX = screenShake > 0.5 ? (Math.random() - 0.5) * screenShake * 2 : 0;
  const shakeY = screenShake > 0.5 ? (Math.random() - 0.5) * screenShake * 2 : 0;

  ctx.save();
  ctx.translate(shakeX, shakeY);

  // 背景
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#5D4037');
  bgGrad.addColorStop(0.5, '#6D4C41');
  bgGrad.addColorStop(1, '#795548');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(-10, -10, W + 20, H + 20);

  // 地面纹理
  ctx.fillStyle = 'rgba(62,39,35,0.3)';
  for (let i = 0; i < 8; i++) {
    ctx.fillRect(0, H - 80 + i * 10, W, 2);
  }

  // 角色（在石块中间）
  drawCharacters();

  // 石块
  rocks.forEach(drawRock);

  // 发射器
  drawLauncher();

  if (gameState === 'aiming' && aimStart) drawAimLine();

  balls.forEach(drawBall);
  particles.forEach(drawParticle);
  floatingTexts.forEach(drawFloatingText);

  // 营救成功提示
  if (rescuePhase === 1) {
    ctx.fillStyle = '#81C784';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🎉 石块清除！父子得救！', W / 2, H / 2);
  }

  // 暂停遮罩
  if (isPaused) {
    ctx.fillStyle = 'rgba(62,39,35,0.9)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#FFCC80';
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⏸ 已暂停', W / 2, H / 2);
  }

  ctx.restore();
}

function drawCharacters() {
  const centerX = W / 2;
  const centerY = H / 2 + 20;

  // 被困时的抖动
  const trappedShake = charState === 'trapped' ? Math.sin(charAnimTime * 0.005) * 1 : 0;
  const dangerShake = charState === 'danger' ? (Math.random() - 0.5) * 3 : 0;
  const celebrateBob = charState === 'rescued' ? Math.abs(Math.sin(charAnimTime * 0.02)) * 10 : 0;

  const x = centerX + trappedShake + dangerShake;
  const y = centerY + celebrateBob;

  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(x, y + 35, 40, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  // 父亲
  drawQCharacter(x - 25, y, 28, '#FFCC80', '#E65100', fatherBlink > 0, charState === 'trapped', charState === 'danger', charState === 'rescued');
  // 儿子
  drawQCharacter(x + 20, y + 5, 22, '#FFE0B2', '#FB8C00', sonBlink > 0, charState === 'trapped', charState === 'danger', charState === 'rescued');

  // 获救光芒
  if (charState === 'rescued') {
    ctx.globalAlpha = 0.4 + Math.sin(charAnimTime * 0.03) * 0.2;
    const grad = ctx.createRadialGradient(x, y, 10, x, y, 100);
    grad.addColorStop(0, '#FFD700');
    grad.addColorStop(1, 'rgba(255,215,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(x - 100, y - 100, 200, 200);
    ctx.globalAlpha = 1;
  }
}

function drawQCharacter(x, y, size, skinColor, hairColor, isBlinking, isWorried, isDanger, isHappy) {
  // 身体
  ctx.fillStyle = hairColor;
  ctx.beginPath();
  ctx.arc(x, y + size * 0.3, size * 0.55, 0, Math.PI * 2);
  ctx.fill();

  // 头
  ctx.fillStyle = skinColor;
  ctx.beginPath();
  ctx.arc(x, y - size * 0.15, size * 0.45, 0, Math.PI * 2);
  ctx.fill();

  // 头发
  ctx.fillStyle = hairColor;
  ctx.beginPath();
  ctx.arc(x, y - size * 0.35, size * 0.35, Math.PI, 2 * Math.PI);
  ctx.fill();

  // 眼睛
  const eyeY = y - size * 0.12;
  if (isBlinking) {
    ctx.fillStyle = '#333';
    ctx.fillRect(x - size * 0.2, eyeY, size * 0.12, 2);
    ctx.fillRect(x + size * 0.08, eyeY, size * 0.12, 2);
  } else if (isDanger) {
    // 惊恐表情
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(x - size * 0.17, eyeY, size * 0.08, 0, Math.PI * 2);
    ctx.arc(x + size * 0.17, eyeY, size * 0.08, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x - size * 0.15, eyeY - 2, size * 0.03, 0, Math.PI * 2);
    ctx.arc(x + size * 0.19, eyeY - 2, size * 0.03, 0, Math.PI * 2);
    ctx.fill();
  } else if (isWorried) {
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - size * 0.22, eyeY - size * 0.08); ctx.lineTo(x - size * 0.12, eyeY - size * 0.12);
    ctx.moveTo(x + size * 0.1, eyeY - size * 0.12); ctx.lineTo(x + size * 0.2, eyeY - size * 0.08);
    ctx.stroke();
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(x - size * 0.17, eyeY, size * 0.06, 0, Math.PI * 2);
    ctx.arc(x + size * 0.17, eyeY, size * 0.06, 0, Math.PI * 2);
    ctx.fill();
  } else if (isHappy) {
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x - size * 0.17, eyeY, size * 0.08, 0.2 * Math.PI, 0.8 * Math.PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x + size * 0.17, eyeY, size * 0.08, 0.2 * Math.PI, 0.8 * Math.PI);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(x - size * 0.14, eyeY, size * 0.07, 0, Math.PI * 2);
    ctx.arc(x + size * 0.14, eyeY, size * 0.07, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x - size * 0.12, eyeY - size * 0.02, size * 0.025, 0, Math.PI * 2);
    ctx.arc(x + size * 0.16, eyeY - size * 0.02, size * 0.025, 0, Math.PI * 2);
    ctx.fill();
  }

  // 嘴巴
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  if (isDanger) {
    ctx.beginPath();
    ctx.arc(x, y + size * 0.15, size * 0.12, 0, Math.PI * 2);
    ctx.stroke();
  } else if (isWorried) {
    ctx.beginPath();
    ctx.arc(x, y + size * 0.18, size * 0.1, 1.1 * Math.PI, 1.9 * Math.PI);
    ctx.stroke();
  } else if (isHappy) {
    ctx.beginPath();
    ctx.arc(x, y + size * 0.06, size * 0.15, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.arc(x, y + size * 0.1, size * 0.12, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.stroke();
  }

  // 腮红
  const blushColor = isDanger ? 'rgba(255,100,100,0.5)' : isWorried ? 'rgba(150,150,200,0.4)' : isHappy ? 'rgba(255,150,150,0.5)' : 'rgba(255,150,150,0.4)';
  ctx.fillStyle = blushColor;
  ctx.beginPath();
  ctx.ellipse(x - size * 0.28, y + size * 0.02, size * 0.1, size * 0.06, 0, 0, Math.PI * 2);
  ctx.ellipse(x + size * 0.28, y + size * 0.02, size * 0.1, size * 0.06, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawRock(rock) {
  const sx = rock.shake ? (Math.random() - 0.5) * rock.shake : 0;
  const sy = rock.shake ? (Math.random() - 0.5) * rock.shake : 0;

  const x = rock.x + sx;
  const y = rock.y + sy;
  const w = rock.w;
  const h = rock.h;
  const color = getRockColor(rock);

  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(x + 3, y + 3, w, h);

  // 主体
  const grad = ctx.createLinearGradient(x, y, x, y + h);
  grad.addColorStop(0, lightenColor(color, 15));
  grad.addColorStop(0.5, color);
  grad.addColorStop(1, darkenColor(color, 25));
  ctx.fillStyle = grad;
  ctx.fillRect(x, y, w, h);

  // 边框
  ctx.strokeStyle = darkenColor(color, 15);
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);

  // 纹理
  ctx.strokeStyle = darkenColor(color, 10);
  ctx.beginPath();
  ctx.moveTo(x + w * 0.2, y + h * 0.3);
  ctx.lineTo(x + w * 0.5, y + h * 0.6);
  ctx.moveTo(x + w * 0.6, y + h * 0.2);
  ctx.lineTo(x + w * 0.3, y + h * 0.5);
  ctx.stroke();

  // 高光
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(x, y, w * 0.6, h * 0.3);

  // 特殊标记
  if (rock.special) {
    const icon = { gold: '⭐', bomb: '💣', time: '⏰', multi: '✨' }[rock.special];
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(icon, x + w/2, y + h/2 - 2);
  }

  // 数字
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.font = `bold ${Math.min(14, h * 0.4)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowBlur = 2; ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.fillText(rock.hits, x + w/2, y + h/2 + (rock.special ? 8 : 0));
  ctx.shadowBlur = 0;
}

function drawLauncher() {
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(launcherX, launcherY + 6, 16, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  const grad = ctx.createRadialGradient(launcherX - 3, launcherY - 3, 0, launcherX, launcherY, 14);
  grad.addColorStop(0, '#FFCC80');
  grad.addColorStop(0.7, '#FF9800');
  grad.addColorStop(1, '#E65100');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(launcherX, launcherY, 14, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#FFF8E1';
  ctx.beginPath();
  ctx.arc(launcherX, launcherY, 10, 0, Math.PI * 2);
  ctx.fill();
}

function drawAimLine() {
  const len = 90;
  const ex = launcherX + Math.cos(aimAngle) * len;
  const ey = launcherY + Math.sin(aimAngle) * len;

  ctx.strokeStyle = 'rgba(255,204,128,0.85)';
  ctx.lineWidth = 3;
  ctx.setLineDash([8, 6]);
  ctx.beginPath();
  ctx.moveTo(launcherX, launcherY);
  ctx.lineTo(ex, ey);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#FF6F00';
  ctx.shadowBlur = 8;
  ctx.shadowColor = 'rgba(255,111,0,0.6)';
  ctx.beginPath();
  ctx.arc(ex, ey, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawBall(ball) {
  ball.trail.forEach((p, i) => {
    const alpha = i / ball.trail.length * 0.35;
    const r = BALL_R * (i / ball.trail.length) * 0.7;
    ctx.fillStyle = `rgba(255,204,128,${alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
  });

  const grad = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 0, ball.x, ball.y, BALL_R);
  grad.addColorStop(0, '#FFF8E1');
  grad.addColorStop(0.5, '#FFCC80');
  grad.addColorStop(1, '#FFB74D');

  ctx.fillStyle = grad;
  ctx.shadowBlur = 8;
  ctx.shadowColor = 'rgba(255,160,0,0.4)';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath();
  ctx.arc(ball.x - 2, ball.y - 2, BALL_R * 0.3, 0, Math.PI * 2);
  ctx.fill();
}

function drawParticle(p) {
  ctx.globalAlpha = p.life;
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawFloatingText(t) {
  ctx.globalAlpha = t.life;
  ctx.fillStyle = '#FFCC80';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowBlur = 3; ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.fillText(t.text, t.x, t.y);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

function lightenColor(color, percent) {
  const num = parseInt(color.replace('#', ''), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.min(255, (num >> 16) + amt);
  const G = Math.min(255, ((num >> 8) & 0xFF) + amt);
  const B = Math.min(255, (num & 0xFF) + amt);
  return `rgb(${R},${G},${B})`;
}

function darkenColor(color, percent) {
  const num = parseInt(color.replace('#', ''), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.max(0, (num >> 16) - amt);
  const G = Math.max(0, ((num >> 8) & 0xFF) - amt);
  const B = Math.max(0, (num & 0xFF) - amt);
  return `rgb(${R},${G},${B})`;
}

// ════════════════════════════════════════════════════════════
//  主循环
// ════════════════════════════════════════════════════════════
let lastTime = 0;
function gameLoop(time) {
  const dt = Math.min(time - lastTime, 32);
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

window.addEventListener('load', init);
</script>
