<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>快乐消除 Happy Bricks - V7.0 变异营救</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;touch-action:none}
body{background:linear-gradient(180deg,#5D4037 0%,#4E342E 50%,#3E2723 100%);font-family:-apple-system,'Segoe UI',sans-serif;display:flex;justify-content:center;align-items:center;user-select:none;-webkit-user-select:none}

#game-container{position:relative;width:100%;max-width:420px;height:100%;max-height:800px;display:flex;flex-direction:column;background:linear-gradient(180deg,#795548 0%,#8D6E63 40%,#A1887F 100%);overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,0.6)}

/* 顶部状态栏 */
#header{flex:0 0 auto;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(62,39,35,0.95),rgba(62,39,35,0.85));backdrop-filter:blur(10px);z-index:10;box-shadow:0 2px 15px rgba(0,0,0,0.3)}
#header .info{display:flex;gap:12px}
#header .stat{text-align:center;min-width:45px;padding:4px 8px;background:rgba(255,255,255,0.1);border-radius:12px}
#header .stat-value{font-size:1.2em;font-weight:800;color:#FFCC80;text-shadow:0 1px 2px rgba(0,0,0,0.3)}
#header .stat-label{font-size:0.55em;color:#D7CCC8;text-transform:uppercase;letter-spacing:0.5px}
#level-display{font-size:1em;font-weight:800;color:#FFF8E1;background:linear-gradient(135deg,#FF6F00,#E65100);padding:5px 12px;border-radius:15px;box-shadow:0 2px 8px rgba(230,81,0,0.4)}

/* 压力条 */
#pressure-bar{flex:0 0 auto;height:8px;background:#3E2723;position:relative;overflow:hidden}
#pressure-fill{position:absolute;left:0;top:0;height:100%;width:0%;background:linear-gradient(90deg,#FF5722,#FF9800,#FFEB3B);transition:width 0.3s ease;box-shadow:0 0 10px rgba(255,87,34,0.5)}
#pressure-label{position:absolute;right:8px;top:-18px;font-size:0.65em;color:#FFCC80;font-weight:700}

#canvas-wrap{flex:1 1 0;position:relative;overflow:hidden}
#game-canvas{display:block;width:100%;height:100%}

#launch-hint{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);font-size:0.85em;color:#FFF8E1;background:rgba(62,39,35,0.9);padding:10px 18px;border-radius:20px;pointer-events:none;white-space:nowrap;box-shadow:0 4px 15px rgba(0,0,0,0.3);animation:pulse 2s infinite;border:2px solid #FFCC80}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1);opacity:0.95}50%{transform:translateX(-50%) scale(1.03);opacity:1}}

#overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(62,39,35,0.98),rgba(93,64,55,0.98));display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;padding:16px}
#overlay.hidden{display:none}

.title{font-size:2.2em;font-weight:900;background:linear-gradient(135deg,#FFCC80,#FF6F00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;text-shadow:none;animation:bounceIn 0.6s ease-out}
@keyframes bounceIn{0%{transform:scale(0.5);opacity:0}50%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.subtitle{color:#D7CCC8;margin-bottom:16px;font-size:0.95em;text-align:center;line-height:1.6}
.subtitle em{color:#FFCC80;font-style:normal;font-weight:700}

.card{background:rgba(255,255,255,0.08);border-radius:16px;padding:14px 18px;margin:8px 0;box-shadow:0 4px 20px rgba(0,0,0,0.2);max-width:320px;width:100%;border:1px solid rgba(255,204,128,0.2)}
.card-title{font-size:0.75em;color:#FFCC80;font-weight:800;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.card p{font-size:0.85em;color:#D7CCC8;line-height:1.7;margin:3px 0}
.card p strong{color:#FFCC80}

.btn{margin-top:16px;padding:14px 40px;border:none;border-radius:25px;background:linear-gradient(135deg,#FF6F00,#E65100);color:white;font-size:1.1em;font-weight:800;cursor:pointer;box-shadow:0 5px 18px rgba(230,81,0,0.5);transition:transform 0.15s,box-shadow 0.15s;position:relative;overflow:hidden}
.btn:active{transform:scale(0.96);box-shadow:0 3px 12px rgba(230,81,0,0.4)}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);transform:translateX(-100%);animation:shimmer 2s infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}

.result-title{font-size:1.8em;font-weight:800;margin-bottom:12px}
.result-title.win{color:#81C784}
.result-title.lose{color:#EF5350}
.result-stats{display:flex;gap:20px;margin-bottom:16px}
.result-stat{text-align:center;padding:8px 12px;background:rgba(255,255,255,0.08);border-radius:12px}
.result-stat-value{font-size:1.6em;font-weight:800;color:#FFCC80}
.result-stat-label{font-size:0.7em;color:#D7CCC8}

#pause-btn{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.15);border:1px solid rgba(255,204,128,0.3);cursor:pointer;z-index:20;font-size:1em;color:#FFCC80;display:none}
#pause-btn:active{transform:scale(0.95)}
#sound-btn{position:absolute;top:8px;left:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.15);border:1px solid rgba(255,204,128,0.3);cursor:pointer;z-index:20;font-size:0.9em;color:#FFCC80;display:none}
#sound-btn:active{transform:scale(0.95)}

/* 连锁爆炸波纹 */
@keyframes chain-wave{0%{transform:scale(0.5);opacity:1}100%{transform:scale(2.5);opacity:0}}
.chain-wave{position:absolute;border-radius:50%;border:3px solid #FFD700;animation:chain-wave 0.4s ease-out forwards;pointer-events:none}

/* 连锁文字 */
#chain-display{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:2.5em;font-weight:900;color:#FFD700;text-shadow:0 0 20px rgba(255,215,0,0.8),0 0 40px rgba(255,111,0,0.5);pointer-events:none;z-index:50;opacity:0;transition:opacity 0.2s}
#chain-display.show{opacity:1;animation:chainPop 0.6s ease-out}
@keyframes chainPop{0%{transform:translate(-50%,-50%) scale(0.5)}40%{transform:translate(-50%,-50%) scale(1.2)}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}

/* 紧急状态动画 */
@keyframes danger-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,87,34,0.4)}50%{box-shadow:0 0 0 8px rgba(255,87,34,0)}}
.danger-mode{animation:danger-pulse 1s infinite}

/* 对白气泡 */
#dialog-box{position:absolute;bottom:140px;left:10px;right:10px;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:50}
.dialog-bubble{max-width:85%;padding:10px 14px;border-radius:16px;font-size:0.85em;font-weight:700;animation:dialogIn 0.3s ease-out;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
.dialog-bubble.son{background:linear-gradient(135deg,#64B5F6,#42A5F5);color:#E3F2FD;align-self:flex-start;border-bottom-left-radius:4px}
.dialog-bubble.father{background:linear-gradient(135deg,#FFCC80,#FF9800);color:#FFF3E0;align-self:flex-end;border-bottom-right-radius:4px}
@keyframes dialogIn{from{transform:scale(0.8) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}

/* 变异模式提示 */
#mutation-banner{position:absolute;top:50px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#E91E63,#9C27B0);color:#FFF;padding:12px 24px;border-radius:20px;font-size:0.9em;font-weight:800;text-align:center;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:60;box-shadow:0 4px 20px rgba(156,39,176,0.5)}
#mutation-banner.show{opacity:1;animation:bannerPulse 0.6s ease-out}
@keyframes bannerPulse{0%{transform:translateX(-50%) scale(0.5)}50%{transform:translateX(-50%) scale(1.1)}100%{transform:translateX(-50%) scale(1)}}
#mutation-banner .name{font-size:1.1em;margin-bottom:4px}
#mutation-banner .desc{font-size:0.8em;opacity:0.9}

/* 守护石光环 */
.guardian-glow{position:absolute;border-radius:50%;pointer-events:none;animation:guardianPulse 2s infinite}
@keyframes guardianPulse{0%,100%{opacity:0.3;transform:scale(1)}50%{opacity:0.6;transform:scale(1.15)}}
</style>
</head>
<body>
<div id="game-container">
  <div id="header">
    <div class="info">
      <div class="stat"><span class="stat-value" id="score-val">0</span><span class="stat-label">分数</span></div>
      <div class="stat"><span class="stat-value" id="balls-val">10</span><span class="stat-label">弹球</span></div>
      <div class="stat"><span class="stat-value" id="time-val">60</span><span class="stat-label">时间</span></div>
      <div class="stat" id="combo-display" style="display:none"><span class="stat-value" id="combo-val">0</span><span class="stat-label">连击</span></div>
    </div>
    <div id="level-display">第 1 关</div>
  </div>
  <div id="pressure-bar">
    <div id="pressure-fill"></div>
    <span id="pressure-label">⚠️ 石块压力</span>
  </div>
  <button id="pause-btn" onclick="togglePause()">⏸</button>
  <button id="sound-btn" onclick="toggleSound()">🔊</button>
  <div id="canvas-wrap">
    <canvas id="game-canvas"></canvas>
    <div id="chain-display"></div>
    <div id="launch-hint">👆 滑动瞄准，快速清除石块！</div>
    <div id="dialog-box"></div>
    <div id="mutation-banner"><div class="name"></div><div class="desc"></div></div>
  </div>
  <div id="overlay">
    <div class="title">🪨 救援行动 V7.0</div>
    <div class="subtitle">石块从四面围困父子！<br>时间紧迫，<em>快速清除石块</em>让他们脱险！</div>
    <div class="card">
      <div class="card-title">🚨 紧急状况</div>
      <p>父子被困在石圈中央！</p>
      <p>上方石块持续施加<strong>压力</strong>！</p>
      <p>必须在<strong>压力满之前</strong>清除所有石块！</p>
    </div>
    <div class="card">
      <div class="card-title">🌀 V7.0 新特性</div>
      <p>🔥 <b>连锁坍塌</b> — 一次消除触发多级爆炸</p>
      <p>🎲 <b>变异无尽</b> — 每5关规则突变，分数翻倍</p>
      <p>🛡️ <b>守护石</b> — 护盾/时光/磁力三种守护</p>
      <p>💬 <b>父子对白</b> — 动态剧情，情感共鸣</p>
    </div>
    <div class="card">
      <div class="card-title">💎 特殊道具</div>
      <p>⭐ <b>金币石</b> — 额外分数</p>
      <p>💣 <b>炸弹石</b> — 爆炸清场</p>
      <p>✨ <b>分裂石</b> — 多球齐发</p>
      <p>⏰ <b>时间石</b> — 减少压力</p>
    </div>
    <button class="btn" onclick="startGame()">▶ 剧情模式</button>
    <button class="btn" style="background:linear-gradient(135deg,#E91E63,#9C27B0);margin-top:10px" onclick="startEndless()">♾ 无尽模式</button>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════
//  快乐消除 Happy Bricks - V7.0 变异无尽模式
//  连锁坍塌 + 变异规则 + 守护石 + 父子对白
// ════════════════════════════════════════════════════════════

let canvas, ctx;
let W, H;

// 游戏状态
let gameState = 'idle';
let level = 1;
let score = 0;
let ballsRemaining = 10;
let timeRemaining = 60;
let highScore = parseInt(localStorage.getItem('happyBricksHighScore5') || '0');
// 连击系统
let comboCount = 0;
let comboTimer = 0;
let comboMultiplier = 1;
const COMBO_WINDOW = 1500;
let rocks = [];
let balls = [];
let particlePool = [];
let particles = [];
const MAX_PARTICLES = 200;

function getParticle() {
  if (particlePool.length > 0) return particlePool.pop();
  return {};
}

function recycleParticle(p) {
  if (particlePool.length < MAX_PARTICLES) particlePool.push(p);
}

// 连锁坍塌系统
let chainQueue = []; // 待处理的连锁石块队列
let chainDepth = 0; // 当前连锁深度
let chainPending = 0; // 待处理连锁数
let isChaining = false; // 连锁动画中
const CHAIN_SPREAD_DELAY = 80; // 连锁传播延迟(ms)
const CHAIN_RADIUS = 65; // 连锁传播半径（像素）
let chainWaves = []; // 连锁波纹特效

let floatingTexts = [];
let isPaused = false;

// ════════════════════════════════════════════════════════════
//  P1: 变异无尽模式 + 守护石 + 对白系统
// ════════════════════════════════════════════════════════════
// 变异模式配置
const MUTATIONS = {
  normal: { name: '正常模式', desc: '标准规则', ballSpeed: 1, pressureRate: 1, scoreMult: 1 },
  gravity: { name: '重力翻转', desc: '石块从下方涌入', ballSpeed: 1, pressureRate: 1.2, scoreMult: 1.5 },
  frozen: { name: '冰冻世界', desc: '球速减半', ballSpeed: 0.5, pressureRate: 0.8, scoreMult: 1.3 },
  rage: { name: '狂暴时刻', desc: '压力加速', ballSpeed: 1.2, pressureRate: 1.8, scoreMult: 2 },
  double: { name: '双倍狂欢', desc: '分数×2', ballSpeed: 1, pressureRate: 1, scoreMult: 2 },
  dark: { name: '黑暗降临', desc: '视野受限', ballSpeed: 1, pressureRate: 1.3, scoreMult: 1.8 }
};
const MUTATION_ORDER = ['normal', 'gravity', 'frozen', 'rage', 'double', 'dark'];
let currentMutation = 'normal';
let endlessMode = false;
let endlessLevel = 1;
let mutationAnnounce = null; // 变异切换提示

// 守护石系统
let guardianStones = []; // 守护石列表
const GUARDIAN_TYPES = {
  shield: { name: '护盾守护', color: '#2196F3', effect: '抵消3次碰撞' },
  time: { name: '时光守护', color: '#9C27B0', effect: '冻结压力10秒' },
  magnet: { name: '磁力守护', color: '#F44336', effect: '吸引球10秒' }
};

// 父子对白系统
let dialogQueue = [];
let activeDialog = null;
let dialogCooldown = 0;
const DIALOGS = {
  start: [
    { speaker: 'son', text: '爸爸，我怕...', trigger: 'level_start' },
    { speaker: 'father', text: '别怕，我一定能救你出去！', trigger: 'level_start' }
  ],
  chain2: [
    { speaker: 'son', text: '哇！好厉害！', trigger: 'chain_2' },
    { speaker: 'father', text: '看我的连锁爆破！', trigger: 'chain_2' }
  ],
  chain4: [
    { speaker: 'son', text: '爸爸太强了！', trigger: 'chain_4' },
    { speaker: 'father', text: '还没完呢！', trigger: 'chain_4' }
  ],
  danger: [
    { speaker: 'son', text: '压力好大...', trigger: 'pressure_high' },
    { speaker: 'father', text: '坚持住！', trigger: 'pressure_high' }
  ],
  rescue: [
    { speaker: 'son', text: '我们自由了！', trigger: 'level_win' },
    { speaker: 'father', text: '我就知道能行！', trigger: 'level_win' }
  ],
  mutation: [
    { speaker: 'son', text: '世界变了...', trigger: 'mutation' },
    { speaker: 'father', text: '不管怎样，我都要救你！', trigger: 'mutation' }
  ]
};

// 压力系统
let pressure = 0; // 0-100
let maxPressure = 100;
let pressureRate = 0.08; // 每帧增加量
let pressureReductionPerRock = 8; // 每消除一个石块减少的压力

// 石块配置
const ROCK_SIZE = 32;
const ROCK_PADDING = 4;

// 球配置
const BALL_R = 9;
const BALL_SPEED = 10;

// 瞄准系统
let aimStart = null;
let aimAngle = -Math.PI / 2;
let aimCurrent = null;

// 发射器
let launcherX, launcherY;

// 角色
let charAnimTime = 0;
let fatherBlink = 0, sonBlink = 0;
let charState = 'trapped'; // trapped, rescued, danger
let rescuePhase = 0;
let rescueTimer = 0;

// 震动
let screenShake = 0;

// 音效
let audioCtx = null;
let soundEnabled = true;

// ════════════════════════════════════════════════════════════
//  音效系统
// ════════════════════════════════════════════════════════════
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { soundEnabled = false; }
}

function playSound(type) {
  if (!soundEnabled || !audioCtx) return;
  const now = audioCtx.currentTime;
  try {
    switch(type) {
      case 'launch':
        { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'sine'; osc.frequency.setValueAtTime(500, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
          gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.start(now); osc.stop(now + 0.1); }
        break;
      case 'hit':
        { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'triangle'; osc.frequency.setValueAtTime(250, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
          gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now); osc.stop(now + 0.08); }
        break;
      case 'destroy':
        { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(350, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
          gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.start(now); osc.stop(now + 0.15); }
        break;
      case 'pressure':
        { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'square'; osc.frequency.setValueAtTime(100, now);
          osc.frequency.linearRampToValueAtTime(150, now + 0.1);
          gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.start(now); osc.stop(now + 0.2); }
        break;
      case 'danger':
        { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now);
          gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now); osc.stop(now + 0.3); }
        break;
      case 'win':
        [523, 659, 784, 1047, 1319].forEach((f, i) => {
          const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'sine'; osc.frequency.setValueAtTime(f, now + i * 0.1);
          gain.gain.setValueAtTime(0, now + i * 0.1);
          gain.gain.linearRampToValueAtTime(0.12, now + i * 0.1 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.25);
          osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.25);
        });
        break;
      case 'lose':
        { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(250, now);
          osc.frequency.exponentialRampToValueAtTime(60, now + 0.5);
          gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.start(now); osc.stop(now + 0.5); }
        break;
      case 'bomb':
        { for(let i = 0; i < 4; i++) {
          const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180 - i * 35, now + i * 0.05);
          osc.frequency.exponentialRampToValueAtTime(25, now + i * 0.05 + 0.18);
          gain.gain.setValueAtTime(0.18, now + i * 0.05); gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.18);
          osc.start(now + i * 0.05); osc.stop(now + i * 0.05 + 0.18); } }
        break;
      case 'time':
        { [600, 800, 1000].forEach((f, i) => {
          const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'sine'; osc.frequency.setValueAtTime(f, now + i * 0.08);
          gain.gain.setValueAtTime(0.1, now + i * 0.08); gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.15);
          osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.15); }); }
        break;
    }
  } catch(e) {}
}

// 递进连击音效 - 连击越高越震撼
function playComboSound(level) {
  if (!soundEnabled || !audioCtx) return;
  const now = audioCtx.currentTime;
  try {
    const baseFreq = 400 + level * 100;
    // 基础音
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(baseFreq, now);
    osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, now + 0.12);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.start(now); osc.stop(now + 0.3);
    // 高次泛音
    if (level >= 3) {
      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.connect(gain2); gain2.connect(audioCtx.destination);
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(baseFreq * 2, now);
      osc2.frequency.exponentialRampToValueAtTime(baseFreq * 3, now + 0.15);
      gain2.gain.setValueAtTime(0.08, now);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc2.start(now); osc2.stop(now + 0.25);
    }
    // 超级连锁（5+）额外爆炸音
    if (level >= 5) {
      const osc3 = audioCtx.createOscillator();
      const gain3 = audioCtx.createGain();
      osc3.connect(gain3); gain3.connect(audioCtx.destination);
      osc3.type = 'sawtooth';
      osc3.frequency.setValueAtTime(150, now + 0.05);
      osc3.frequency.exponentialRampToValueAtTime(30, now + 0.4);
      gain3.gain.setValueAtTime(0.15, now + 0.05);
      gain3.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc3.start(now + 0.05); osc3.stop(now + 0.4);
    }
  } catch(e) {}
}

//  P1: 对白系统
// ════════════════════════════════════════════════════════════
function triggerDialog(type) {
  if (dialogCooldown > 0) return;
  const dialogs = DIALOGS[type];
  if (!dialogs) return;
  
  dialogs.forEach((d, i) => {
    setTimeout(() => {
      showDialogBubble(d.speaker, d.text);
    }, i * 1800);
  });
  dialogCooldown = 5000; // 5秒冷却
}

function showDialogBubble(speaker, text) {
  const box = document.getElementById('dialog-box');
  const bubble = document.createElement('div');
  bubble.className = `dialog-bubble ${speaker}`;
  bubble.textContent = text;
  box.appendChild(bubble);
  
  // 3秒后移除
  setTimeout(() => {
    bubble.style.opacity = '0';
    bubble.style.transform = 'translateY(-10px)';
    setTimeout(() => bubble.remove(), 300);
  }, 2500);
}

// ════════════════════════════════════════════════════════════
//  P1: 变异模式切换
// ════════════════════════════════════════════════════════════
function switchMutation(level) {
  const idx = Math.floor((level - 1) / 5) % MUTATION_ORDER.length;
  const newMutation = MUTATION_ORDER[idx];
  
  if (newMutation !== currentMutation) {
    currentMutation = newMutation;
    const mut = MUTATIONS[currentMutation];
    
    // 显示变异提示
    const banner = document.getElementById('mutation-banner');
    banner.querySelector('.name').textContent = '🌀 ' + mut.name;
    banner.querySelector('.desc').textContent = mut.desc;
    banner.classList.add('show');
    setTimeout(() => banner.classList.remove('show'), 2500);
    
    // 触发对白
    triggerDialog('mutation');
    
    playSound('launch');
  }
}

function getMutationConfig() {
  return MUTATIONS[currentMutation];
}

// ════════════════════════════════════════════════════════════
//  P1: 守护石系统
// ════════════════════════════════════════════════════════════
function spawnGuardian(x, y) {
  const types = Object.keys(GUARDIAN_TYPES);
  const type = types[Math.floor(Math.random() * types.length)];
  const guardian = {
    x: x,
    y: y,
    type: type,
    radius: 40,
    active: true,
    duration: type === 'shield' ? 3 : 10, // 盾牌按次数，其他按秒
    pulsePhase: 0
  };
  guardianStones.push(guardian);
}

function updateGuardians(dt) {
  guardianStones.forEach(g => {
    if (!g.active) return;
    g.pulsePhase += dt * 0.003;
    
    if (g.type !== 'shield') {
      g.duration -= dt * 0.001;
      if (g.duration <= 0) g.active = false;
    }
    
    // 磁力守护效果
    if (g.type === 'magnet' && g.active) {
      balls.forEach(ball => {
        const dist = Math.hypot(ball.x - g.x, ball.y - g.y);
        if (dist < g.radius * 2 && dist > 5) {
          const force = 0.5 * (1 - dist / (g.radius * 2));
          ball.vx += (g.x - ball.x) / dist * force;
          ball.vy += (g.y - ball.y) / dist * force;
        }
      });
    }
    
    // 时光守护效果
    if (g.type === 'time' && g.active) {
      pressure = Math.max(0, pressure - 0.05);
    }
  });
  
  // 移除失效守护石
  guardianStones = guardianStones.filter(g => g.active);
}

function drawGuardians(ctx) {
  guardianStones.forEach(g => {
    if (!g.active) return;
    const type = GUARDIAN_TYPES[g.type];
    const pulse = 1 + Math.sin(g.pulsePhase) * 0.15;
    
    // 光环
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.radius * pulse, 0, Math.PI * 2);
    ctx.strokeStyle = type.color + '60';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // 核心
    ctx.beginPath();
    ctx.arc(g.x, g.y, 12, 0, Math.PI * 2);
    ctx.fillStyle = type.color;
    ctx.fill();
    ctx.strokeStyle = '#FFF';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // 剩余时间/次数显示
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(g.type === 'shield' ? '×' + g.duration : Math.ceil(g.duration) + 's', g.x, g.y + 4);
  });
}

function hitGuardian(guardian) {
  if (guardian.type === 'shield') {
    guardian.duration--;
    if (guardian.duration <= 0) guardian.active = false;
  }
}

// ════════════════════════════════════════════════════════════
//  游戏控制
// ════════════════════════════════════════════════════════════
function startGame() {
  initAudio();
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('pause-btn').style.display = 'block';
  document.getElementById('sound-btn').style.display = 'block';
  gameState = 'aiming';
  level = 1;
  score = 0;
  endlessMode = false;
  currentMutation = 'normal';
  loadLevel(level);
  // 开局对白
  setTimeout(() => triggerDialog('start'), 500);
}

function startEndless() {
  initAudio();
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('pause-btn').style.display = 'block';
  document.getElementById('sound-btn').style.display = 'block';
  gameState = 'aiming';
  endlessMode = true;
  endlessLevel = 1;
  level = 1;
  score = 0;
  currentMutation = 'normal';
  loadLevel(level);
  setTimeout(() => triggerDialog('start'), 500);
}

function loadLevel(lvl) {
  rocks = [];
  balls = [];
  particles = [];
  floatingTexts = [];
  guardianStones = [];
  chainDepth = 0;
  isChaining = false;
  isPaused = false;
  rescuePhase = 0;
  charState = 'trapped';
  dialogCooldown = 0;
  
  // 无尽模式: 切换变异
  if (endlessMode) {
    switchMutation(endlessLevel);
  }

  const design = lvl <= LEVEL_DESIGNS.length ? LEVEL_DESIGNS[lvl - 1] : null;

  if (design) {
    timeRemaining = design.time;
    pressureRate = design.pressureRate * getMutationConfig().pressureRate;
    maxPressure = 100;
    pressure = 0;
    ballsRemaining = 10 + Math.floor(lvl / 2);

    const rows = design.layout.length;
    const cols = design.layout[0].length;
    const offsetX = (W - cols * (ROCK_SIZE + ROCK_PADDING)) / 2;
    const offsetY = 60;

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const char = design.layout[row][col];
        if (char === '#') {
          const hits = design.rockHits.min + Math.floor(Math.random() * (design.rockHits.max - design.rockHits.min + 1));
          let special = null;
          if (Math.random() < design.specials) {
            const types = ['gold', 'bomb', 'time'];
            if (lvl >= 2) types.push('multi');
            special = types[Math.floor(Math.random() * types.length)];
          }
          rocks.push({
            x: offsetX + col * (ROCK_SIZE + ROCK_PADDING),
            y: offsetY + row * (ROCK_SIZE + ROCK_PADDING),
            w: ROCK_SIZE,
            h: ROCK_SIZE,
            hits,
            maxHits: hits,
            special,
            shake: 0
          });
        } else if (char === 'G') {
          // 守护石位置
          spawnGuardian(
            offsetX + col * (ROCK_SIZE + ROCK_PADDING) + ROCK_SIZE/2,
            offsetY + row * (ROCK_SIZE + ROCK_PADDING) + ROCK_SIZE/2
          );
        }
      }
    }
  } else {
    // 随机生成高级关卡
    timeRemaining = Math.max(40, 60 - lvl * 2);
    pressureRate = Math.min(0.15, 0.06 + lvl * 0.02);
    maxPressure = 100;
    pressure = 0;
    ballsRemaining = 12;

    const cols = Math.floor((W - 20) / (ROCK_SIZE + ROCK_PADDING));
    const rows = Math.floor((H - 150) / (ROCK_SIZE + ROCK_PADDING));
    const offsetX = (W - cols * (ROCK_SIZE + ROCK_PADDING)) / 2;
    const offsetY = 70;

    // 生成环形包围
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        // 只在边缘生成石块，中间留空给角色
        const isEdge = row < 2 || row >= rows - 2 || col < 2 || col >= cols - 2;
        const isCenter = row >= rows/2 - 1 && row <= rows/2 + 1 && col >= cols/2 - 2 && col <= cols/2 + 2;

        if (isEdge && !isCenter && Math.random() > 0.15) {
          const hits = Math.min(2 + Math.floor(lvl / 2), 6);
          let special = null;
          if (Math.random() < 0.12) {
            special = ['gold', 'bomb', 'time', 'multi'][Math.floor(Math.random() * 4)];
          }
          rocks.push({
            x: offsetX + col * (ROCK_SIZE + ROCK_PADDING),
            y: offsetY + row * (ROCK_SIZE + ROCK_PADDING),
            w: ROCK_SIZE,
            h: ROCK_SIZE,
            hits,
            maxHits: hits,
            special,
            shake: 0
          });
        }
      }
    }
  }

  updateUI();
  gameState = 'aiming';
}

function updateUI() {
  document.getElementById('score-val').textContent = score;
  document.getElementById('balls-val').textContent = ballsRemaining;
  document.getElementById('time-val').textContent = Math.ceil(timeRemaining);
  const comboEl = document.getElementById('combo-display');
  if (comboMultiplier > 1) { comboEl.style.display = ''; document.getElementById('combo-val').textContent = 'x'+comboMultiplier; comboEl.style.background = comboMultiplier >= 5 ? 'rgba(255,215,0,0.3)' : 'rgba(255,255,255,0.1)'; } else { comboEl.style.display = 'none'; }
  
  // 关卡显示：无尽模式显示关数+变异
  const levelDisplay = document.getElementById('level-display');
  if (endlessMode) {
    levelDisplay.textContent = `∞ ${endlessLevel} · ${MUTATIONS[currentMutation].name}`;
    levelDisplay.style.background = 'linear-gradient(135deg,#E91E63,#9C27B0)';
  } else {
    levelDisplay.textContent = `第 ${level} 关`;
    levelDisplay.style.background = 'linear-gradient(135deg,#FF6F00,#E65100)';
  }

  const pressurePercent = Math.min(100, (pressure / maxPressure) * 100);
  document.getElementById('pressure-fill').style.width = pressurePercent + '%';

  // 危险模式视觉提示
  const container = document.getElementById('game-container');
  if (pressurePercent > 80) {
    container.classList.add('danger-mode');
    charState = 'danger';
  } else {
    container.classList.remove('danger-mode');
    if (charState === 'danger') charState = 'trapped';
  }
}

function togglePause() {
  if (gameState === 'idle' || gameState === 'win' || gameState === 'lose') return;
  isPaused = !isPaused;
  document.getElementById('pause-btn').textContent = isPaused ? '▶' : '⏸';
}

// ════════════════════════════════════════════════════════════
//  输入处理
// ════════════════════════════════════════════════════════════
function onPointerDown(e) {
  if (gameState !== 'aiming' || isPaused) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  aimStart = { x: (e.clientX - rect.left) * W / rect.width, y: (e.clientY - rect.top) * H / rect.height };
  aimCurrent = { x: aimStart.x, y: aimStart.y };
  document.getElementById('launch-hint').style.opacity = '0';
}

function onPointerMove(e) {
  if (!aimStart || gameState !== 'aiming' || isPaused) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const cx = (e.clientX - rect.left) * W / rect.width;
  const cy = (e.clientY - rect.top) * H / rect.height;
  aimCurrent = { x: cx, y: cy };
  const dx = cx - aimStart.x, dy = cy - aimStart.y;
  if (Math.hypot(dx, dy) < 8) return;
  aimAngle = Math.atan2(dy, dx);
}

function onPointerUp(e) {
  if (!aimStart || gameState !== 'aiming' || isPaused) return;
  e.preventDefault();
  aimStart = null; aimCurrent = null;
  launchBall();
}

function launchBall() {
  if (ballsRemaining <= 0) return;
  balls.push({ x: launcherX, y: launcherY, vx: Math.cos(aimAngle) * BALL_SPEED, vy: Math.sin(aimAngle) * BALL_SPEED, trail: [] });
  ballsRemaining--;
  updateUI();
  gameState = 'playing';
  playSound('launch');
}

// ════════════════════════════════════════════════════════════
//  游戏更新
// ════════════════════════════════════════════════════════════
function update(dt) {
  if (gameState === 'idle' || gameState === 'win' || gameState === 'lose' || isPaused) return;
  
  // 对白冷却
  if (dialogCooldown > 0) dialogCooldown -= dt * 0.001;
  
  // 守护石更新
  updateGuardians(dt);

  charAnimTime += dt;
  if (Math.random() < 0.003) fatherBlink = 8;
  if (Math.random() < 0.004) sonBlink = 6;
  if (fatherBlink > 0) fatherBlink--;
  if (sonBlink > 0) sonBlink--;

  if (screenShake > 0) screenShake *= 0.9;

  // 压力系统
  if (rescuePhase === 0) {
    pressure += pressureRate;
    if (pressure >= maxPressure) {
      gameState = 'lose';
      playSound('lose');
      showResult(false);
      return;
    }
    // 危险音效和对白
    if (pressure > maxPressure * 0.85) {
      if (Math.random() < 0.02) playSound('danger');
      // 第一次进入危险区触发对白
      if (pressure > maxPressure * 0.85 && pressure < maxPressure * 0.87) {
        triggerDialog('danger');
      }
    }
  }

  // 营救动画
  if (rescuePhase > 0) {
    rescueTimer += dt;
    if (rescuePhase === 1) {
      if (rescueTimer > 60) {
        rescuePhase = 2;
        charState = 'rescued';
      }
    } else if (rescuePhase === 2) {
      if (rescueTimer > 120) {
        gameState = 'win';
        playSound('win');
        // 时间奖励: 剩余时间×10分
            const timeBonus = Math.floor(timeRemaining * 10);
            score += timeBonus;
            addFloatingText(W/2, H/2 - 50, '+' + timeBonus + ' 时间奖励!');
            if (score > highScore) { highScore = score; localStorage.setItem('happyBricksHighScore5', highScore); }
        showResult(true);
      }
    }
    return;
  }

  // 更新球
  for (let i = balls.length - 1; i >= 0; i--) {
    const ball = balls[i];
    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 8) ball.trail.shift();
    ball.x += ball.vx;
    ball.y += ball.vy;

    // 墙壁反弹
    if (ball.x < BALL_R) { ball.x = BALL_R; ball.vx = -ball.vx; }
    if (ball.x > W - BALL_R) { ball.x = W - BALL_R; ball.vx = -ball.vx; }
    if (ball.y < BALL_R) { ball.y = BALL_R; ball.vy = -ball.vy; }
    if (ball.y > H + BALL_R) { balls.splice(i, 1); continue; }

    // 石块碰撞
    for (let j = rocks.length - 1; j >= 0; j--) {
      const rock = rocks[j];
      if (checkCollision(ball, rock)) {
        rock.hits--;
        rock.shake = 5;
        playSound('hit');
        spawnHitParticles(ball.x, ball.y, getRockColor(rock));

        if (rock.hits <= 0) {
            // 连击系统
            const now = Date.now();
            if (now - comboTimer < COMBO_WINDOW) {
              comboCount++;
              comboMultiplier = Math.min(8, 1 + Math.floor(comboCount / 3));
            } else {
              comboCount = 1;
              comboMultiplier = 1;
            }
            comboTimer = now;

            pressure = Math.max(0, pressure - pressureReductionPerRock);

            let points = 10;
            if (rock.special === 'gold') points = 50;
            else if (rock.special === 'bomb') points = 20;
            else if (rock.special === 'time') points = 15;
            else if (rock.special === 'multi') points = 25;

            // 应用连击倍率
            points = Math.floor(points * comboMultiplier);

            // x3/x5以上触发额外分数奖励
            if (comboMultiplier >= 3) {
              points += Math.floor(points * 0.5);
            }

            score += points;

            // 连击特效
            if (comboMultiplier > 1) {
              addFloatingText(rock.x + rock.w/2, rock.y - 18, 'x' + comboMultiplier + ' 连击!');
              if (comboCount % 3 === 0) { playComboSound(comboMultiplier); }
            }

            spawnDestroyParticles(rock.x + rock.w/2, rock.y + rock.h/2, getRockColor(rock));
            addFloatingText(rock.x + rock.w/2, rock.y, '+' + points);

          if (rock.special === 'bomb') { playSound('bomb'); explodeNearby(rock.x + rock.w/2, rock.y + rock.h/2, true); }
          else if (rock.special === 'time') { playSound('time'); pressure = Math.max(0, pressure - 20); addFloatingText(rock.x + rock.w/2, rock.y - 20, '⏰-20%'); }
          else if (rock.special === 'multi') { playSound('launch'); splitBall(ball); }
          else { playSound('destroy'); }

          // 触发连锁坍塌系统
          triggerChain(rock.x + rock.w/2, rock.y + rock.h/2, rock);

          rocks.splice(j, 1);
          updateUI();
        }
      }
    }
  }

  rocks.forEach(r => { if (r.shake > 0) r.shake *= 0.85; });
  particles = particles.filter(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= 0.02; if (p.life <= 0) { recycleParticle(p); return false; } return true; });
  floatingTexts = floatingTexts.filter(t => { t.y -= 1; t.life -= 0.015; return t.life > 0; });

  // 检查胜利
  if (rocks.length === 0 && rescuePhase === 0) {
    rescuePhase = 1;
    rescueTimer = 0;
    gameState = 'rescue';
  }

  // 检查回合结束
  if (balls.length === 0 && rescuePhase === 0) {
    if (ballsRemaining <= 0 && rocks.length > 0) {
      // 没球了但还有石块，给一点压力惩罚
      pressure += 10;
      ballsRemaining = 3; // 救济球
      addFloatingText(W/2, H/2, '救济 +3球');
      updateUI();
    }
    if (ballsRemaining > 0) {
      gameState = 'aiming';
      document.getElementById('launch-hint').style.opacity = '1';
    }
  }

  updateUI();
}

function checkCollision(ball, rock) {
  // 精确向量反射: 找到最近点
  const cx = Math.max(rock.x, Math.min(ball.x, rock.x + rock.w));
  const cy = Math.max(rock.y, Math.min(ball.y, rock.y + rock.h));
  const dx = ball.x - cx;
  const dy = ball.y - cy;
  const distSq = dx * dx + dy * dy;
  const radSq = BALL_R * BALL_R;
  
  if (distSq < radSq) {
    // 计算碰撞法向量（角落情况特殊处理）
    const dist = Math.sqrt(distSq) || 0.001;
    let nx = dx / dist;
    let ny = dy / dist;
    
    // 如果在砖块内部，检测从哪边进入
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) {
      // 角落碰撞 - 使用更精确的判断
      const overlapX = Math.min(ball.x - rock.x, rock.x + rock.w - ball.x);
      const overlapY = Math.min(ball.y - rock.y, rock.y + rock.h - ball.y);
      if (overlapX < overlapY) {
        nx = ball.x < rock.x + rock.w / 2 ? -1 : 1;
        ny = 0;
      } else {
        nx = 0;
        ny = ball.y < rock.y + rock.h / 2 ? -1 : 1;
      }
    }
    
    // 向量反射: v' = v - 2(v·n)n
    const dot = ball.vx * nx + ball.vy * ny;
    ball.vx = ball.vx - 2 * dot * nx;
    ball.vy = ball.vy - 2 * dot * ny;
    
    // 推出重叠区域防止粘连
    const overlap = BALL_R - dist;
    ball.x += nx * (overlap + 0.5);
    ball.y += ny * (overlap + 0.5);
    
    return true;
  }
  return false;
}

function getRockColor(rock) {
  if (rock.special) {
    return { gold: '#FFD700', bomb: '#FF5722', time: '#2196F3', multi: '#9C27B0' }[rock.special];
  }
  const colors = ['#8D6E63', '#795548', '#6D4C41', '#5D4037', '#4E342E', '#A1887F'];
  return colors[Math.min(rock.maxHits - rock.hits, colors.length - 1)];
}

function splitBall(orig) {
  for (let i = 0; i < 2; i++) {
    const angle = Math.atan2(orig.vy, orig.vx) + (Math.random() - 0.5) * 0.5;
    balls.push({ x: orig.x, y: orig.y, vx: Math.cos(angle) * BALL_SPEED, vy: Math.sin(angle) * BALL_SPEED, trail: [] });
  }
}

function explodeNearby(x, y, isChain) {
  const RADIUS = 70;
  let destroyed = 0;
  rocks.forEach(r => {
    const dist = Math.hypot(r.x + r.w/2 - x, r.y + r.h/2 - y);
    if (dist < RADIUS) {
      r.hits -= 2;
      spawnDestroyParticles(r.x + r.w/2, r.y + r.h/2, '#FF5722');
      if (r.hits <= 0) {
        destroyed++;
        triggerChain(r.x + r.w/2, r.y + r.h/2, r);
      }
    }
  });
  rocks = rocks.filter(r => r.hits > 0);
  if (destroyed > 0) {
    pressure = Math.max(0, pressure - destroyed * pressureReductionPerRock);
    addFloatingText(x, y, `💣 x${destroyed}`);
  }
}

// ════════════════════════════════════════════════════════════
//  连锁坍塌系统 V6.0
// ════════════════════════════════════════════════════════════
function triggerChain(x, y, destroyedRock) {
  // 找出范围内所有石块，加入连锁队列
  const toChain = [];
  rocks.forEach(r => {
    const dist = Math.hypot(r.x + r.w/2 - x, r.y + r.h/2 - y);
    if (dist < CHAIN_RADIUS && dist > 5) {
      toChain.push({ rock: r, dist: dist });
    }
  });

  if (toChain.length > 0) {
    chainDepth++;
    screenShake = Math.max(screenShake, Math.min(chainDepth * 2, 8));

    // 连锁对白触发
    if (chainDepth === 2) triggerDialog('chain2');
    if (chainDepth >= 4) triggerDialog('chain4');

    // 连锁提示
    if (chainDepth >= 2) {
      const el = document.getElementById('chain-display');
      el.textContent = '连锁 x' + chainDepth;
      el.classList.remove('show');
      void el.offsetWidth;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 600);
    }

    // 添加波纹特效
    addChainWave(x, y, chainDepth);

    // 按距离排序，延迟触发
    toChain.sort((a, b) => a.dist - b.dist);
    toChain.forEach((item, idx) => {
      const delay = (idx + 1) * CHAIN_SPREAD_DELAY;
      setTimeout(() => {
        if (item.rock.hits > 0) {
          item.rock.hits--;
          item.rock.shake = 8;
          spawnDestroyParticles(item.rock.x + item.rock.w/2, item.rock.y + item.rock.h/2, getRockColor(item.rock));
          if (item.rock.hits <= 0) {
            score += Math.floor(10 * comboMultiplier);
            pressure = Math.max(0, pressure - pressureReductionPerRock);
            addFloatingText(item.rock.x + item.rock.w/2, item.rock.y, '+' + Math.floor(10 * comboMultiplier));
            triggerChain(item.rock.x + item.rock.w/2, item.rock.y + item.rock.h/2, item.rock);
            rocks = rocks.filter(r => r !== item.rock);
            updateUI();
          }
          updateUI();
        }
      }, delay);
    });
  }

  // 连锁结束，播音效
  if (toChain.length === 0 && chainDepth > 0) {
    setTimeout(() => {
      if (chainDepth >= 3) playChainEndSound(chainDepth);
      chainDepth = 0;
    }, CHAIN_SPREAD_DELAY * 2);
  }
}

function addChainWave(x, y, depth) {
  const wrap = document.getElementById('canvas-wrap');
  const wave = document.createElement('div');
  wave.className = 'chain-wave';
  const size = 40 + depth * 10;
  wave.style.width = size + 'px';
  wave.style.height = size + 'px';
  wave.style.left = (x - size/2) + 'px';
  wave.style.top = (y - size/2) + 'px';
  wave.style.borderColor = depth >= 3 ? '#FFD700' : depth >= 2 ? '#FF9800' : '#FF5722';
  wave.style.animationDuration = (0.3 + depth * 0.05) + 's';
  wrap.appendChild(wave);
  setTimeout(() => wave.remove(), 500);
}

function playChainEndSound(depth) {
  playComboSound(Math.min(depth, 8));
}

function spawnHitParticles(x, y, color) {
  for (let i = 0; i < 5; i++) {
    const p = getParticle();
    p.x = x; p.y = y; p.vx = (Math.random() - 0.5) * 4; p.vy = (Math.random() - 0.5) * 4 - 1;
    p.life = 1; p.color = color; p.size = 3 + Math.random() * 3;
    particles.push(p);
  }
}

function spawnDestroyParticles(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 * i) / 12;
    const p = getParticle();
    p.x = x; p.y = y; p.vx = Math.cos(angle) * 3; p.vy = Math.sin(angle) * 3 - 1;
    p.life = 1; p.color = color; p.size = 4 + Math.random() * 3;
    particles.push(p);
  }
}

function addFloatingText(x, y, text) {
  floatingTexts.push({ x, y, text, life: 1 });
}

function showResult(win) {
  document.getElementById('pause-btn').style.display = 'none';
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('hidden');
  
  // 营救成功对白
  if (win) triggerDialog('rescue');
  
  const mutationLabel = endlessMode ? `<div class="result-stat"><div class="result-stat-value" style="color:#E91E63">${MUTATIONS[currentMutation].name}</div><div class="result-stat-label">变异模式</div></div>` : '';
  
  overlay.innerHTML = `
    <div class="result-title ${win ? 'win' : 'lose'}">${win ? '🎉 营救成功！' : '💔 营救失败'}</div>
    <div class="result-stats">
      <div class="result-stat"><div class="result-stat-value">${score}</div><div class="result-stat-label">分数</div></div>
      <div class="result-stat"><div class="result-stat-value">${endlessMode ? endlessLevel : level}</div><div class="result-stat-label">${endlessMode ? '无尽关数' : '关卡'}</div></div>
      <div class="result-stat"><div class="result-stat-value">${Math.ceil(timeRemaining)}</div><div class="result-stat-label">剩余时间</div></div>
      ${mutationLabel}
    </div>
    <button class="btn" onclick="${win ? 'nextLevel()' : 'retryLevel()'}">${win ? (endlessMode ? '▶ 下一关' : '▶ 下一关') : '🔄 重试'}</button>
  `;
}

function nextLevel() {
  if (endlessMode) {
    endlessLevel++;
    loadLevel(endlessLevel);
  } else {
    level++;
    loadLevel(level);
  }
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('pause-btn').style.display = 'block';
}

function retryLevel() {
  loadLevel(level);
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('pause-btn').style.display = 'block';
}

// ════════════════════════════════════════════════════════════
//  绘制
// ════════════════════════════════════════════════════════════
function draw() {
  const shakeX = screenShake > 0.5 ? (Math.random() - 0.5) * screenShake * 2 : 0;
  const shakeY = screenShake > 0.5 ? (Math.random() - 0.5) * screenShake * 2 : 0;

  ctx.save();
  ctx.translate(shakeX, shakeY);

  // 背景
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#5D4037');
  bgGrad.addColorStop(0.5, '#6D4C41');
  bgGrad.addColorStop(1, '#795548');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(-10, -10, W + 20, H + 20);

  // 地面纹理
  ctx.fillStyle = 'rgba(62,39,35,0.3)';
  for (let i = 0; i < 8; i++) {
    ctx.fillRect(0, H - 80 + i * 10, W, 2);
  }

  // 角色（在石块中间）
  drawCharacters();

  // 石块
  rocks.forEach(drawRock);
  
  // 守护石
  drawGuardians(ctx);

  // 发射器
  drawLauncher();

  if (gameState === 'aiming' && aimStart) drawAimLine();

  balls.forEach(drawBall);
  particles.forEach(drawParticle);
  floatingTexts.forEach(drawFloatingText);

  // 营救成功提示
  if (rescuePhase === 1) {
    ctx.fillStyle = '#81C784';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🎉 石块清除！父子得救！', W / 2, H / 2);
  }

  // 暂停遮罩
  if (isPaused) {
    ctx.fillStyle = 'rgba(62,39,35,0.9)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#FFCC80';
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⏸ 已暂停', W / 2, H / 2);
  }

  ctx.restore();
}

function drawCharacters() {
  const centerX = W / 2;
  const centerY = H / 2 + 20;

  // 被困时的抖动
  const trappedShake = charState === 'trapped' ? Math.sin(charAnimTime * 0.005) * 1 : 0;
  const dangerShake = charState === 'danger' ? (Math.random() - 0.5) * 3 : 0;
  const celebrateBob = charState === 'rescued' ? Math.abs(Math.sin(charAnimTime * 0.02)) * 10 : 0;

  const x = centerX + trappedShake + dangerShake;
  const y = centerY + celebrateBob;

  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(x, y + 35, 40, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  // 父亲
  drawQCharacter(x - 25, y, 28, '#FFCC80', '#E65100', fatherBlink > 0, charState === 'trapped', charState === 'danger', charState === 'rescued');
  // 儿子
  drawQCharacter(x + 20, y + 5, 22, '#FFE0B2', '#FB8C00', sonBlink > 0, charState === 'trapped', charState === 'danger', charState === 'rescued');

  // 获救光芒
  if (charState === 'rescued') {
    ctx.globalAlpha = 0.4 + Math.sin(charAnimTime * 0.03) * 0.2;
    const grad = ctx.createRadialGradient(x, y, 10, x, y, 100);
    grad.addColorStop(0, '#FFD700');
    grad.addColorStop(1, 'rgba(255,215,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(x - 100, y - 100, 200, 200);
    ctx.globalAlpha = 1;
  }
}

function drawQCharacter(x, y, size, skinColor, hairColor, isBlinking, isWorried, isDanger, isHappy) {
  // 身体
  ctx.fillStyle = hairColor;
  ctx.beginPath();
  ctx.arc(x, y + size * 0.3, size * 0.55, 0, Math.PI * 2);
  ctx.fill();

  // 头
  ctx.fillStyle = skinColor;
  ctx.beginPath();
  ctx.arc(x, y - size * 0.15, size * 0.45, 0, Math.PI * 2);
  ctx.fill();

  // 头发
  ctx.fillStyle = hairColor;
  ctx.beginPath();
  ctx.arc(x, y - size * 0.35, size * 0.35, Math.PI, 2 * Math.PI);
  ctx.fill();

  // 眼睛
  const eyeY = y - size * 0.12;
  if (isBlinking) {
    ctx.fillStyle = '#333';
    ctx.fillRect(x - size * 0.2, eyeY, size * 0.12, 2);
    ctx.fillRect(x + size * 0.08, eyeY, size * 0.12, 2);
  } else if (isDanger) {
    // 惊恐表情
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(x - size * 0.17, eyeY, size * 0.08, 0, Math.PI * 2);
    ctx.arc(x + size * 0.17, eyeY, size * 0.08, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x - size * 0.15, eyeY - 2, size * 0.03, 0, Math.PI * 2);
    ctx.arc(x + size * 0.19, eyeY - 2, size * 0.03, 0, Math.PI * 2);
    ctx.fill();
  } else if (isWorried) {
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - size * 0.22, eyeY - size * 0.08); ctx.lineTo(x - size * 0.12, eyeY - size * 0.12);
    ctx.moveTo(x + size * 0.1, eyeY - size * 0.12); ctx.lineTo(x + size * 0.2, eyeY - size * 0.08);
    ctx.stroke();
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(x - size * 0.17, eyeY, size * 0.06, 0, Math.PI * 2);
    ctx.arc(x + size * 0.17, eyeY, size * 0.06, 0, Math.PI * 2);
    ctx.fill();
  } else if (isHappy) {
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x - size * 0.17, eyeY, size * 0.08, 0.2 * Math.PI, 0.8 * Math.PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x + size * 0.17, eyeY, size * 0.08, 0.2 * Math.PI, 0.8 * Math.PI);
    ctx.stroke();
  } else {
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(x - size * 0.14, eyeY, size * 0.07, 0, Math.PI * 2);
    ctx.arc(x + size * 0.14, eyeY, size * 0.07, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x - size * 0.12, eyeY - size * 0.02, size * 0.025, 0, Math.PI * 2);
    ctx.arc(x + size * 0.16, eyeY - size * 0.02, size * 0.025, 0, Math.PI * 2);
    ctx.fill();
  }

  // 嘴巴
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  if (isDanger) {
    ctx.beginPath();
    ctx.arc(x, y + size * 0.15, size * 0.12, 0, Math.PI * 2);
    ctx.stroke();
  } else if (isWorried) {
    ctx.beginPath();
    ctx.arc(x, y + size * 0.18, size * 0.1, 1.1 * Math.PI, 1.9 * Math.PI);
    ctx.stroke();
  } else if (isHappy) {
    ctx.beginPath();
    ctx.arc(x, y + size * 0.06, size * 0.15, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.arc(x, y + size * 0.1, size * 0.12, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.stroke();
  }

  // 腮红
  const blushColor = isDanger ? 'rgba(255,100,100,0.5)' : isWorried ? 'rgba(150,150,200,0.4)' : isHappy ? 'rgba(255,150,150,0.5)' : 'rgba(255,150,150,0.4)';
  ctx.fillStyle = blushColor;
  ctx.beginPath();
  ctx.ellipse(x - size * 0.28, y + size * 0.02, size * 0.1, size * 0.06, 0, 0, Math.PI * 2);
  ctx.ellipse(x + size * 0.28, y + size * 0.02, size * 0.1, size * 0.06, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawRock(rock) {
  const sx = rock.shake ? (Math.random() - 0.5) * rock.shake : 0;
  const sy = rock.shake ? (Math.random() - 0.5) * rock.shake : 0;

  const x = rock.x + sx;
  const y = rock.y + sy;
  const w = rock.w;
  const h = rock.h;
  const color = getRockColor(rock);

  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(x + 3, y + 3, w, h);

  // 主体
  const grad = ctx.createLinearGradient(x, y, x, y + h);
  grad.addColorStop(0, lightenColor(color, 15));
  grad.addColorStop(0.5, color);
  grad.addColorStop(1, darkenColor(color, 25));
  ctx.fillStyle = grad;
  ctx.fillRect(x, y, w, h);

  // 边框
  ctx.strokeStyle = darkenColor(color, 15);
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);

  // 纹理
  ctx.strokeStyle = darkenColor(color, 10);
  ctx.beginPath();
  ctx.moveTo(x + w * 0.2, y + h * 0.3);
  ctx.lineTo(x + w * 0.5, y + h * 0.6);
  ctx.moveTo(x + w * 0.6, y + h * 0.2);
  ctx.lineTo(x + w * 0.3, y + h * 0.5);
  ctx.stroke();

  // 高光
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(x, y, w * 0.6, h * 0.3);

  // 特殊标记
  if (rock.special) {
    const icon = { gold: '⭐', bomb: '💣', time: '⏰', multi: '✨' }[rock.special];
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(icon, x + w/2, y + h/2 - 2);
  }

  // 数字
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.font = `bold ${Math.min(14, h * 0.4)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowBlur = 2; ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.fillText(rock.hits, x + w/2, y + h/2 + (rock.special ? 8 : 0));
  ctx.shadowBlur = 0;
}

function drawLauncher() {
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(launcherX, launcherY + 6, 16, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  const grad = ctx.createRadialGradient(launcherX - 3, launcherY - 3, 0, launcherX, launcherY, 14);
  grad.addColorStop(0, '#FFCC80');
  grad.addColorStop(0.7, '#FF9800');
  grad.addColorStop(1, '#E65100');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(launcherX, launcherY, 14, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#FFF8E1';
  ctx.beginPath();
  ctx.arc(launcherX, launcherY, 10, 0, Math.PI * 2);
  ctx.fill();
}

function drawAimLine() {
  const len = 90;
  const ex = launcherX + Math.cos(aimAngle) * len;
  const ey = launcherY + Math.sin(aimAngle) * len;

  ctx.strokeStyle = 'rgba(255,204,128,0.85)';
  ctx.lineWidth = 3;
  ctx.setLineDash([8, 6]);
  ctx.beginPath();
  ctx.moveTo(launcherX, launcherY);
  ctx.lineTo(ex, ey);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#FF6F00';
  ctx.shadowBlur = 8;
  ctx.shadowColor = 'rgba(255,111,0,0.6)';
  ctx.beginPath();
  ctx.arc(ex, ey, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawBall(ball) {
  ball.trail.forEach((p, i) => {
    const alpha = i / ball.trail.length * 0.35;
    const r = BALL_R * (i / ball.trail.length) * 0.7;
    ctx.fillStyle = `rgba(255,204,128,${alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
  });

  const grad = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 0, ball.x, ball.y, BALL_R);
  grad.addColorStop(0, '#FFF8E1');
  grad.addColorStop(0.5, '#FFCC80');
  grad.addColorStop(1, '#FFB74D');

  ctx.fillStyle = grad;
  ctx.shadowBlur = 8;
  ctx.shadowColor = 'rgba(255,160,0,0.4)';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath();
  ctx.arc(ball.x - 2, ball.y - 2, BALL_R * 0.3, 0, Math.PI * 2);
  ctx.fill();
}

function drawParticle(p) {
  ctx.globalAlpha = p.life;
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawFloatingText(t) {
  ctx.globalAlpha = t.life;
  ctx.fillStyle = '#FFCC80';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowBlur = 3; ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.fillText(t.text, t.x, t.y);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

function lightenColor(color, percent) {
  const num = parseInt(color.replace('#', ''), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.min(255, (num >> 16) + amt);
  const G = Math.min(255, ((num >> 8) & 0xFF) + amt);
  const B = Math.min(255, (num & 0xFF) + amt);
  return `rgb(${R},${G},${B})`;
}

function darkenColor(color, percent) {
  const num = parseInt(color.replace('#', ''), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.max(0, (num >> 16) - amt);
  const G = Math.max(0, ((num >> 8) & 0xFF) - amt);
  const B = Math.max(0, (num & 0xFF) - amt);
  return `rgb(${R},${G},${B})`;
}

// ════════════════════════════════════════════════════════════
//  主循环
// ════════════════════════════════════════════════════════════
let lastTime = 0;
function gameLoop(time) {
  const dt = Math.min(time - lastTime, 32);
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

window.addEventListener('load', init);
</script>
